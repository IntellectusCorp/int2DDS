[package]
name = "int2dds-derive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Procedural macros for int2DDS - DdsType derive macro for automatic type support generation"
keywords = ["dds", "derive", "macro", "codegen"]
categories = [
    "development-tools::procedural-macro-helpers",
    "network-programming",
]
documentation = "https://docs.rs/int2dds-derive"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
md5 = "0.8"

# Dev-only and deliberately path-only (Cargo strips path-only dev-dependencies on
# publish, so this does not deadlock the derive-then-dds publish order).
# `derive` is the one workspace crate that pulls in neither `log` nor `speedy`,
# which makes it the only place `tests/facade.rs` can compile macro output the way
# a downstream consumer sees it.
[dev-dependencies]
int2dds = { path = "../dds" }
