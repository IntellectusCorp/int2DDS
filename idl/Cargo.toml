[package]
name = "int2dds-idl"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "IDL code generator for int2DDS - generates Rust, C, Python, C#, Java and XML type definitions from OMG IDL"
readme = "README.md"

[[bin]]
name = "int2dds-idl"
path = "src/main.rs"

[lib]
name = "int2dds_idl"
path = "src/lib.rs"

[dependencies]
md5 = "0.8.0"
dialoguer = { version = "0.11", default-features = false, features = ["completion"] }

[dev-dependencies]
int2dds.workspace = true
speedy = "0.8.0"
log = "0.4.11"
