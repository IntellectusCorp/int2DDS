[package]
name = "int2dds-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "C FFI bindings for int2DDS DDS implementation"
keywords = ["dds", "ffi", "c-bindings", "interop"]
categories = ["network-programming", "api-bindings", "external-ffi-bindings"]
documentation = "https://docs.rs/int2dds-ffi"
readme = "README.md"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
int2dds = { path = "../dds" }
bytes = "1"
md5 = "0.8"
log = "0.4.11"
env_logger = "0.11"

[dev-dependencies]
int2dds-derive = { path = "../derive" }
speedy = "0.8"
md5 = "0.8"

[build-dependencies]
cbindgen = "0.29"

# Windows host only: used by build.rs to embed a PE VERSIONINFO resource
# (FileVersion / ProductVersion) into the DLL.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = []
