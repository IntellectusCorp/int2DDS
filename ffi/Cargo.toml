[package]
name = "int2dds-ffi"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "C FFI bindings for int2DDS DDS implementation"
keywords = ["dds", "ffi", "c-bindings", "interop"]
categories = ["network-programming", "api-bindings", "external-ffi-bindings"]
documentation = "https://docs.rs/int2dds-ffi"
readme = "README.md"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
int2dds = { path = "../dds" }
md5 = "0.7"
log = "0.4.11"
env_logger = "0.11"

[build-dependencies]
cbindgen = "0.29"

[features]
default = []
