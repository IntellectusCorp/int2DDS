# cbindgen configuration for int2dds FFI

language = "C"
cpp_compat = true
include_guard = "INT2DDS_FFI_H"
header = "/* Auto-generated by cbindgen. Do not edit manually. */"

[export]
# Export items from the root and all submodules
include = ["Int2Dds"]

[export.rename]
# Rename types if needed

[fn]
# Function configuration
rename_args = "None"

[struct]
# Struct configuration
derive_eq = false

[enum]
# Enum configuration
rename_variants = "None"

[defines]
# Define macros if needed

[parse]
parse_deps = true
include = ["int2dds"]
