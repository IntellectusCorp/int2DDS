name: 'Run DDS Interoperability Test'
description: 'Run interoperability test for a specific DDS implementation'
inputs:
  dds-name:
    description: 'Name of the DDS implementation (e.g., connext, dust, eprosima)'
    required: true
  executable-pattern:
    description: 'Pattern to match the DDS executable file (e.g., connext_dds-*_shape_main_linux)'
    required: true
  role:
    description: 'Test role: "publisher" or "subscriber"'
    required: true
  dump-packet:
    description: 'Enable tcpdump packet capture'
    required: false
    default: 'false'
  enable-int2dds-logging:
    description: 'Enable int2DDS logging'
    required: false
    default: 'false'
  range-start:
    description: 'Test case to start at, inclusive. Empty starts at the first case'
    required: false
    default: ''
  range-end:
    description: 'Test case to stop after, inclusive. Empty runs to the last case'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Run Interoperability test for ${{ inputs.dds-name }} (${{ inputs.role }})
      run: |
        source .venv/bin/activate

        OUT="$GITHUB_WORKSPACE/case_artifacts/${{ inputs.dds-name }}_${{ inputs.role }}"
        REPORT="$GITHUB_WORKSPACE/junit_report_${{ inputs.dds-name }}_${{ inputs.role }}.xml"
        mkdir -p "$OUT"

        cd executables
        chmod +x ./${{ inputs.executable-pattern }}
        chmod +x ./int2DDS_shape_main_linux

        # Expand the glob to the actual executable path once, so it is not passed as a
        # literal (with '*') to the python runner.
        DDS_EXE=$(ls ./${{ inputs.executable-pattern }} | head -n1)

        if [ "${{ inputs.dump-packet }}" = "true" ]; then
          echo "Installing tshark..."
          sudo apt-get update -qq
          sudo apt-get install -y tshark
          sudo tshark --version
        fi

        if [ "${{ inputs.role }}" = "publisher" ]; then
          echo "Testing Publisher ${{ inputs.dds-name }} --- Subscriber int2dds"
          PUB="$DDS_EXE"
          SUB="./int2DDS_shape_main_linux"
        else
          echo "Testing Publisher int2dds --- Subscriber ${{ inputs.dds-name }}"
          PUB="./int2DDS_shape_main_linux"
          SUB="$DDS_EXE"
        fi

        # Test case names come from the dictionaries defined in the upstream test_suite file.
        # Read with ast instead of importing so this does not depend on the runner's imports.
        CASES=$(python3 -c "
        import ast
        names = []
        for node in ast.parse(open('../test_suite.py').read()).body:
            if isinstance(node, ast.Assign) and isinstance(node.value, ast.Dict):
                names += [k.value for k in node.value.keys if isinstance(k, ast.Constant)]
        print(' '.join(dict.fromkeys(names)))
        ")

        # Slice the suite to the requested range, keeping the order test_suite.py defines.
        START="${{ inputs.range-start }}"
        END="${{ inputs.range-end }}"

        if [ -n "$START" ] || [ -n "$END" ]; then
          SELECTED=""
          IN_RANGE=0
          [ -z "$START" ] && IN_RANGE=1

          for tc in $CASES; do
            [ "$tc" = "$START" ] && IN_RANGE=1
            [ "$IN_RANGE" = "1" ] && SELECTED="$SELECTED $tc"
            [ -n "$END" ] && [ "$tc" = "$END" ] && break
          done

          CASES="$SELECTED"

          if [ -z "$CASES" ]; then
            echo "::error::No test case matches range start='$START' end='$END'"
            exit 1
          fi
        fi

        echo "Running $(echo $CASES | wc -w) test cases one at a time"

        # Uploaded together with the per-case files so the artifact root stays at OUT
        # even when only one case produces output.
        echo "$CASES" | tr ' ' '\n' > "$OUT/cases.txt"

        TOTAL=$(echo $CASES | wc -w)
        INDEX=0

        for tc in $CASES; do
          INDEX=$((INDEX + 1))
          CASE_DIR="$OUT/$tc"
          mkdir -p "$CASE_DIR"
          STARTED=$SECONDS
          echo "[$INDEX/$TOTAL] $tc"

          TSHARK_PID=""
          if [ "${{ inputs.dump-packet }}" = "true" ]; then
            # tshark hands the capture to dumpcap, which drops privileges and cannot write
            # into the runner workspace. Capture under /tmp and move the file afterwards.
            PCAP="/tmp/capture_$tc.pcap"
            rm -f "$PCAP"
            sudo tshark -i any -f 'udp' -q -w "$PCAP" &
            TSHARK_PID=$!

            # The pcap header is written once the capture is live. Waiting for it instead
            # of sleeping a fixed amount keeps discovery packets out of the startup gap.
            for _ in $(seq 100); do
              [ -s "$PCAP" ] && break
              sleep 0.05
            done
            [ -s "$PCAP" ] || echo "::warning::tshark did not start capturing for $tc"
          fi

          python3 ../interoperability_report.py -P "$PUB" -S "$SUB" -t "$tc" -o "$REPORT" \
            || echo "::warning::interoperability_report.py exited non-zero on $tc"

          if [ -n "$TSHARK_PID" ]; then
            sudo kill -TERM "$TSHARK_PID" 2>/dev/null || true
            wait "$TSHARK_PID" 2>/dev/null || true
            sudo mv "$PCAP" "$CASE_DIR/capture.pcap" 2>/dev/null || true
          fi

          mv ./*.log "$CASE_DIR/" 2>/dev/null || true
          echo "[$INDEX/$TOTAL] $tc done in $((SECONDS - STARTED))s"
        done

        # Each -t invocation appends its own testsuite element. Merge them back into one
        # so the downstream xlsx/html report sees the same shape as a whole-suite run.
        python3 "$GITHUB_WORKSPACE/.github/scripts/collapse_junit.py" "$REPORT"

        sudo chown -R "$(id -u):$(id -g)" "$OUT"
        du -sh "$OUT"
      shell: bash
    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: junit_report_${{ inputs.dds-name }}_${{ inputs.role }}
        path: ./junit_report_${{ inputs.dds-name }}_${{ inputs.role }}.xml
    - name: Upload logs
      if: inputs.enable-int2dds-logging == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: logs_${{ inputs.dds-name }}_${{ inputs.role }}
        path: |
          case_artifacts/${{ inputs.dds-name }}_${{ inputs.role }}/cases.txt
          case_artifacts/${{ inputs.dds-name }}_${{ inputs.role }}/**/*.log
    - name: Upload tshark capture
      if: inputs.dump-packet == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: tshark_${{ inputs.dds-name }}_${{ inputs.role }}
        path: |
          case_artifacts/${{ inputs.dds-name }}_${{ inputs.role }}/cases.txt
          case_artifacts/${{ inputs.dds-name }}_${{ inputs.role }}/**/*.pcap
