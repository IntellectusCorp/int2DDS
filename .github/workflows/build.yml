name: Build
run-name: "Build ${{ github.head_ref }}"

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Disable Windows Defender realtime monitoring
        if: runner.os == 'Windows'
        run: Set-MpPreference -DisableRealtimeMonitoring $true
        shell: powershell

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0
          components: clippy
          rustflags: ""

      - name: Load cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-develop
          save-if: false

      - name: Clippy & Build
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C linker=lld-link' || '' }}
        run: |
          cargo clippy
          cargo build

  build-arm32:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM32 cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0
          target: armv7-unknown-linux-gnueabihf
          rustflags: ""

      - name: Load cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-develop
          save-if: false

      - name: Cross build for ARM32
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run: cargo build --target armv7-unknown-linux-gnueabihf

  cross-platform-build:
    runs-on: ubuntu-latest
    needs: [build, build-arm32]
    if: always()
    steps:
      - name: Check build result
        run: |
          if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.build-arm32.result }}" != "success" ]; then
            echo "Build failed on one or more platforms"
            exit 1
          fi
          echo "All builds succeeded"
