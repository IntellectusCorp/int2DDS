name: Build
run-name: "Build ${{ github.head_ref }}"

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Disable Windows Defender realtime monitoring
        if: runner.os == 'Windows'
        run: Set-MpPreference -DisableRealtimeMonitoring $true
        shell: powershell

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0
          components: clippy
          rustflags: ""

      - name: Load cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-develop
          save-if: false

      - name: Clippy & Build
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C linker=lld-link' || '' }}
        run: |
          cargo clippy
          cargo build

  build-arm32:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM32 cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0
          target: armv7-unknown-linux-gnueabihf
          rustflags: ""

      - name: Load cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-develop
          save-if: false

      - name: Cross build for ARM32
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run: cargo build --target armv7-unknown-linux-gnueabihf

  # Fails when a dependency is licensed outside about.toml's accepted list or its
  # license cannot be determined. Same command as the release workflow's
  # LICENSE-THIRD-PARTY.md generation, so a problem surfaces here first.
  # cargo-about collects license texts only, so the second step fails when a crate
  # in the same dependency graph (normal dependencies, every target) ships a
  # NOTICE file that the generated file would have to carry.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3

      - name: Check third-party licenses
        run: cargo about generate --workspace --locked --fail -o "$RUNNER_TEMP/LICENSE-THIRD-PARTY.md" about.hbs

      - name: Check for upstream NOTICE files
        run: |
          cargo tree --workspace --locked -e normal --target all --prefix none --format '{p}' \
            | sed -E 's/ \((\*|proc-macro)\)//g' | grep -v -e ' (' -e '^$' | sort -u \
            | sed -E 's/^(.*) v(.*)$/\1-\2/' > "$RUNNER_TEMP/crates.txt"
          for crate in $(cat "$RUNNER_TEMP/crates.txt"); do
            find "${CARGO_HOME:-$HOME/.cargo}"/registry/src/*/"$crate" -maxdepth 1 -type f -iname 'NOTICE*'
          done > "$RUNNER_TEMP/notices.txt"
          if [ -s "$RUNNER_TEMP/notices.txt" ]; then
            echo "Dependencies ship NOTICE files that LICENSE-THIRD-PARTY.md does not reproduce:"
            cat "$RUNNER_TEMP/notices.txt"
            exit 1
          fi

  cross-platform-build:
    runs-on: ubuntu-latest
    needs: [build, build-arm32, licenses]
    if: always()
    steps:
      - name: Check build result
        run: |
          if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.build-arm32.result }}" != "success" ] || [ "${{ needs.licenses.result }}" != "success" ]; then
            echo "Build or license check failed"
            exit 1
          fi
          echo "All builds succeeded"
