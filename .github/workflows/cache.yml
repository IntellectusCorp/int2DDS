name: Cache Cargo Dependencies Build
run-name: Cache Cargo Dependencies Build

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  cache-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Disable Windows Defender realtime monitoring
        if: runner.os == 'Windows'
        run: Set-MpPreference -DisableRealtimeMonitoring $true
        shell: powershell

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0
          rustflags: ""

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-develop

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build once to populate cache
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C linker=lld-link' || '' }}
        run: cargo test --no-run