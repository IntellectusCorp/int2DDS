name: Cache Cargo Dependencies
run-name: "Cache dependencies"

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  cache-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-2022]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disable Windows Defender realtime monitoring
        if: runner.os == 'Windows'
        run: Set-MpPreference -DisableRealtimeMonitoring $true
        shell: powershell

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0
          rustflags: ""

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-develop

      - name: Build once to populate cache
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C linker=lld-link' || '' }}
        run: cargo build --all-targets