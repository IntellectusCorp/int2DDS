name: Prepare Develop Cache

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  cache-build:
    if: github.ref == 'refs/heads/develop'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Disable Windows Defender realtime monitoring
        if: runner.os == 'Windows'
        run: Set-MpPreference -DisableRealtimeMonitoring $true
        shell: powershell

      - name: Set cargo target directory to D drive
        if: runner.os == 'Windows'
        run: echo "CARGO_TARGET_DIR=D:\cargo-target" >> $env:GITHUB_ENV
        shell: powershell

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0
          rustflags: ""

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-develop

      - name: Build once to populate cache
        run: cargo build