name: Library Integration Tests
run-name: Run integration tests on ${{ github.head_ref }}

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0
          rustflags: ""

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Configure socket buffer size
        run: |
          sudo sysctl -w net.core.rmem_max=5242880
          sudo sysctl -w net.core.wmem_max=5242880
          sudo sysctl -w net.core.rmem_default=5242880
          sudo sysctl -w net.core.wmem_default=5242880

      - name: Run integration tests
        run: cargo test --test "*" -- --test-threads=1