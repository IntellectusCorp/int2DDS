name: Library Integration Tests
run-name: Run integration tests on ${{ github.head_ref }}

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  integration-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Disable Windows Defender realtime monitoring
        if: runner.os == 'Windows'
        run: Set-MpPreference -DisableRealtimeMonitoring $true
        shell: powershell

      - name: Set cargo target directory to D drive
        if: runner.os == 'Windows'
        run: echo "CARGO_TARGET_DIR=D:\cargo-target" >> $env:GITHUB_ENV
        shell: powershell

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0
          rustflags: ""

      - name: Load cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-develop
          save-if: false

      - name: Run integration tests
        env:
          INT2DDS_UDP_SOCKET_BUFFER: 5242880
        run: cargo test --test "*" -- --test-threads=1

      - name: Run cleanup tests
        env:
          INT2DDS_UDP_SOCKET_BUFFER: 5242880
        run: cargo test -- test_all_logic_cleanup test_all_handler_cleanup --test-threads=1
