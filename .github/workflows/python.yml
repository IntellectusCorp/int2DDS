name: Python Tests
run-name: "Python tests ${{ github.head_ref }}"

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "python/**"
      - "ffi/**"
      - ".github/workflows/python.yml"
  push:
    branches: [develop, main]
    paths:
      - "python/**"
      - "ffi/**"
  workflow_dispatch:

jobs:
  python-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""

      - name: Load Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ffi -> target
          shared-key: ffi-${{ matrix.os }}

      - name: Build FFI library
        run: cargo build --release
        working-directory: ffi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        working-directory: python

      - name: Set FFI library path (Linux)
        if: runner.os == 'Linux'
        run: echo "INT2DDS_FFI_PATH=${{ github.workspace }}/ffi/target/release/libint2dds_ffi.so" >> $GITHUB_ENV

      - name: Set FFI library path (macOS)
        if: runner.os == 'macOS'
        run: echo "INT2DDS_FFI_PATH=${{ github.workspace }}/ffi/target/release/libint2dds_ffi.dylib" >> $GITHUB_ENV

      - name: Set FFI library path (Windows)
        if: runner.os == 'Windows'
        run: echo "INT2DDS_FFI_PATH=${{ github.workspace }}\ffi\target\release\int2dds_ffi.dll" >> $env:GITHUB_ENV

      - name: Run pytest
        run: pytest -v --tb=short
        working-directory: python
        env:
          INT2DDS_UDP_SOCKET_BUFFER: 5242880

      - name: Run type check with mypy
        run: mypy int2dds --ignore-missing-imports
        working-directory: python
        continue-on-error: true

      - name: Run linter with ruff
        run: ruff check int2dds
        working-directory: python
        continue-on-error: true

  python-cdr-only:
    # CDR tests don't need FFI library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest cffi
        working-directory: python

      - name: Run CDR tests only
        run: pytest tests/test_cdr.py -v
        working-directory: python
