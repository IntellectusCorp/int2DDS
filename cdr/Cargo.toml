[package]
name = "int2dds-cdr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CDR/XCDR serialization kernel for int2DDS - wire format encoding independent of DDS entities"
keywords = ["dds", "cdr", "xcdr", "serialization", "rtps"]
categories = ["encoding", "network-programming"]
documentation = "https://docs.rs/int2dds-cdr"

[dependencies]
bytes = "1"
log = { version = "0.4.11", features = ["release_max_level_error"] }
speedy = "0.8.0"

# Dev-only and deliberately path-only (Cargo strips path-only dev-dependencies on
# publish, so this does not deadlock the cdr-then-dds publish order).
#
# This reaches `tests/` only, never `src/`. A `#[cfg(test)]` module inside `src/`
# would see two `int2dds-cdr` instances -- its own `--test` build plus the rlib
# `int2dds` links -- so `crate::` types would stop unifying with `int2dds::` ones.
# An integration target links only the rlib, so there is one instance and the two
# paths name the same type. Hence the split: kernel-internal tests in `src/`,
# `#[derive(DdsType)]` wire vectors in `tests/derive_wire/`.
[dev-dependencies]
int2dds = { path = "../dds" }
