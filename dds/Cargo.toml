[package]
name = "int2dds"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Rust implementation of the Data Distribution Service (DDS) middleware standard with RTPS protocol support"
keywords = ["dds", "rtps", "middleware", "pubsub", "realtime"]
categories = ["network-programming", "embedded", "api-bindings"]
documentation = "https://docs.rs/int2dds"
readme = "../README.md"

[features]
default = []

[dependencies]
int2dds-derive = { path = "../derive" }
mio = { version = "1.0.2", features = ["net", "os-poll"] }
network-interface = "2.0.0"
const-default = { version = "1.0.0", features = ["derive", "std", "alloc"] }
bitflags = "2.4"
speedy = "0.8.0"
bytes = "1"
log = { version = "0.4.11", features = ["release_max_level_error"] }
env_logger = "0.11"
socket2 = { version = "0.5", features = ["all"] }
paste = { version = "1.0" }
chrono = "0.4.41"
uuid = { version = "1.17.0", features = ["v4"] }
strum = "0.27.1"
strum_macros = "0.27.1"
rand = "0.9.2"
regex = "1.0"
hostname = "0.4.1"
fern = "0.7.1"
md5 = "0.8"
clap = { version = "4.5", features = ["derive"] }
dashmap = "5.5"
arc-swap = "1.7"
libloading = "0.8"

tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
get_if_addrs = "0.5.3"
crossbeam-channel = "0.5.15"

[target.'cfg(target_os = "linux")'.dependencies]
gpio-cdev = "0.6"

[lib]
crate-type = ["rlib"]
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3.9"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
local-ip-address = "0.6.1"
ctrlc = "3.4.7"
winapi = { version = "0.3", features = [
    "processthreadsapi",
    "tlhelp32",
    "handleapi",
    "winnt",
    "winbase",
    "combaseapi",
    "errhandlingapi",
    "winerror",
    "libloaderapi",
    "memoryapi",
    "minwindef",
] }
# For getting Windows thread names in newer versions
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Memory"] }

[[example]]
name = "hello_world"
path = "examples/hello_world/hello_world.rs"

[[example]]
name = "qos_profile_publisher"
path = "examples/qos_profile/publisher.rs"

[[example]]
name = "qos_profile_subscriber"
path = "examples/qos_profile/subscriber.rs"

[[example]]
name = "dynamic_type_publisher"
path = "examples/xtypes/dynamic_type_publisher.rs"

[[example]]
name = "dynamic_type_subscriber"
path = "examples/xtypes/dynamic_type_subscriber.rs"

[[example]]
name = "route_gateway"
path = "examples/route_gateway/route_gateway.rs"
required-features = []

[dev-dependencies]
husky-rs = "0.1.5"
criterion = { version = "0.7.0", features = ["html_reports"] }
tempfile = "3"
ctrlc = "3.4"

# Faster than opt-level = 0 and still reasonably debuggable
# opt-level = 1: keeps most of the code structure while applying light optimizations → much faster debugging
# opt-level = 2~3: too heavily optimized, making variable tracking difficult

[[bench]]
name = "reliable" # Name of the Rust source file where the benchmark code will be written
harness = false   # Set to false to disable the default benchmark functionality and enable Criterion

[[bench]]
name = "besteffort"
harness = false
